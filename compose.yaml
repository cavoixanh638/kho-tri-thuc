name: kho-tri-thuc

x-django-environment: &django-environment
  DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Copy .env.example to .env}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
  UPLOAD_STAGING_ROOT: /var/lib/kho-tri-thuc/staging
  THUMBNAIL_CACHE_DIR: /var/lib/kho-tri-thuc/thumbnails
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
  GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
  GOOGLE_DRIVE_REDIRECT_URI: ${GOOGLE_DRIVE_REDIRECT_URI:-}
  GOOGLE_DRIVE_TOKEN_KEY: ${GOOGLE_DRIVE_TOKEN_KEY:-}
  SUGGESTION_REVIEW_POC_ENABLED: ${SUGGESTION_REVIEW_POC_ENABLED:-0}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_ALLOW_PREMIUM_MODELS: ${GEMINI_ALLOW_PREMIUM_MODELS:-0}
  GEMINI_OCR_ENABLED: ${GEMINI_OCR_ENABLED:-0}
  GEMINI_MAX_LOCAL_REQUESTS_PER_DAY: ${GEMINI_MAX_LOCAL_REQUESTS_PER_DAY:-80}

services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: ./apps/backend
    image: kho-tri-thuc-backend:dev
    environment: *django-environment
    volumes:
      - upload-staging:/var/lib/kho-tri-thuc/staging
      - thumbnail-cache:/var/lib/kho-tri-thuc/thumbnails
    command:
      - sh
      - -ec
      - |
        python manage.py migrate --noinput
        exec python manage.py runserver 0.0.0.0:8000 --noreload
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      retries: 12

  worker:
    image: kho-tri-thuc-backend:dev
    pull_policy: never
    environment: *django-environment
    volumes:
      - upload-staging:/var/lib/kho-tri-thuc/staging
      - thumbnail-cache:/var/lib/kho-tri-thuc/thumbnails
    command: ["python", "manage.py", "run_worker"]
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_PROXY_TARGET: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12

volumes:
  postgres-data:
  upload-staging:
  thumbnail-cache:
