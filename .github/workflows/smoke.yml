name: KT-001 smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Prevent parallel SHA checkpoints on the same PR from burning Actions minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose and start the stack
        run: |
          git rev-parse HEAD
          cp .env.example .env
          docker compose config --quiet
          docker compose up --detach --build --wait --wait-timeout 120

      - name: Test all frontend DOM and unit suites (native browser harnesses are separate)
        run: docker compose exec -T web npm test

      - name: Check P13 share-target and Vietnamese IME source contracts
        run: node tools/smoke/p13_share_contract.mjs

      - name: Test readiness harness isolation without touching any database
        run: python3 -m unittest discover -s tools/readiness -p test_safety.py -v

      - name: Test immutable backup archive and Drive retry behavior
        run: |
          docker compose cp tools/backup api:/tmp/kt-backup-tools
          docker compose exec -T -e PYTHONPATH=/app -e DJANGO_SETTINGS_MODULE=config.settings api python -m unittest discover -s /tmp/kt-backup-tools -p test_drive_bundle.py -v

      - name: Test controlled pilot isolation gates without external writes
        run: |
          docker compose exec -T api mkdir -p /tmp/kt-pilot/tools /tmp/kt-pilot/evals/knowledge
          docker compose cp tools/knowledge_pilot.py api:/tmp/kt-pilot/tools/knowledge_pilot.py
          docker compose cp tools/test_knowledge_pilot.py api:/tmp/kt-pilot/tools/test_knowledge_pilot.py
          docker compose cp evals/knowledge/pilot-cases.json api:/tmp/kt-pilot/evals/knowledge/pilot-cases.json
          docker compose exec -T api python -m unittest discover -s /tmp/kt-pilot/tools -p test_knowledge_pilot.py -v

      - name: Check Django and migrate forward and backward
        run: |
          docker compose exec -T api python manage.py check --database default
          docker compose exec -T api python manage.py makemigrations --check --dry-run
          docker compose exec -T api python manage.py migrate --check
          docker compose exec -T api python manage.py migrate sessions zero --noinput
          docker compose exec -T api python manage.py migrate sessions --noinput
          docker compose exec -T api python manage.py migrate --check
          docker compose exec -T api python manage.py migrate catalog zero --noinput
          docker compose exec -T api python manage.py migrate --noinput
          docker compose exec -T api python manage.py migrate --check
          docker compose exec -T api python manage.py test

      - name: Check worker, API and built frontend
        run: |
          docker compose exec -T worker python manage.py run_worker --check
          curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/health | jq -e '.status == "ready"'
          curl --fail --silent --show-error http://127.0.0.1:5173/api/v1/health | jq -e '.status == "ready"'
          curl --fail --silent --show-error http://127.0.0.1:5173/ | grep -F '<title>Kho Tri Thức</title>'

      - name: Capture and upload smoke through frontend proxy
        run: |
          docker compose exec -T -e DJANGO_SUPERUSER_PASSWORD=kt-smoke-fixture-only api python manage.py createsuperuser --noinput --username kt-smoke --email kt-smoke@example.invalid
          python3 tools/smoke/capture.py

      - name: Test P13 idempotent Android share through isolated QA PostgreSQL
        env:
          P13_QA_ISOLATED: 'YES'
          P13_QA_USER: kt-smoke
          P13_QA_PASSWORD: kt-smoke-fixture-only
        run: node tools/smoke/p13_share_api.mjs

      - name: Capture real built-App UI screenshots on synthetic CI data
        env:
          KT_PREVIEW_ISOLATED: 'YES'
          KT_PREVIEW_URL: http://127.0.0.1:5173
          KT_PREVIEW_USER: kt-smoke
          KT_PREVIEW_PASSWORD: kt-smoke-fixture-only
        run: |
          browser="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$browser" ]; then
            echo "Chromium/Chrome unavailable on CI runner"; exit 1
          fi
          export KT_JOURNEY_CHROMIUM="$browser"
          node tools/smoke/preview_capture.mjs

      - name: Upload real-App screenshots and SHA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kho-tri-thuc-actual-ui
          path: tmp/kt-preview-ui/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify Compose backup and restore to a fresh database
        run: |
          bundle="$RUNNER_TEMP/kho-tri-thuc-backup"
          python3 tools/backup/backup.py --compose create "$bundle"
          python3 tools/backup/backup.py verify "$bundle"
          docker compose exec -T db sh -ec 'createdb --no-password -U "$POSTGRES_USER" --template=template0 --encoding=UTF8 kt_restore'
          python3 tools/backup/backup.py --compose restore "$bundle" --target-db kt_restore

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop test services
        if: always()
        run: docker compose down --volumes

  browser_acceptance:
    name: G2 browser acceptance with truthful NOT_RUN gate (not production UAT)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the G2 verdict cannot turn NOT_RUN into PASS (offline unit)
        run: node --test tools/smoke/release_acceptance_gate.test.mjs

      - name: Prepare independent disposable PostgreSQL/React/Django QA project
        run: |
          cat > "$RUNNER_TEMP/kt-p08.env" <<'ENV'
          DJANGO_DEBUG=0
          DJANGO_SECRET_KEY=django-insecure-p08-ci-disposable-only
          DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,api
          POSTGRES_DB=kt_p08_journeys
          POSTGRES_USER=kt_p08
          POSTGRES_PASSWORD=p08-only-ci-db-fixture
          API_PORT=62311
          WEB_PORT=62310
          SUGGESTION_REVIEW_POC_ENABLED=1
          GOOGLE_DRIVE_CLIENT_ID=
          GOOGLE_DRIVE_CLIENT_SECRET=
          GOOGLE_DRIVE_REDIRECT_URI=
          GOOGLE_DRIVE_TOKEN_KEY=
          ENV
          chmod 600 "$RUNNER_TEMP/kt-p08.env"
          docker compose -p kt-p08-ci --env-file "$RUNNER_TEMP/kt-p08.env" config --quiet
          docker compose -p kt-p08-ci --env-file "$RUNNER_TEMP/kt-p08.env" up --detach --build --wait --wait-timeout 180 db api worker web
          docker compose -p kt-p08-ci --env-file "$RUNNER_TEMP/kt-p08.env" exec -T -e DJANGO_SUPERUSER_PASSWORD=p08-only-ci-user-fixture api python manage.py createsuperuser --noinput --username p08-fixture --email p08@example.invalid

      - name: Run real browser acceptance with truthful PASS/FAIL/NOT_RUN ledger
        continue-on-error: true
        env:
          KT_JOURNEY_URL: http://127.0.0.1:62310
          KT_JOURNEY_DB_NAME: kt_p08_journeys
          KT_JOURNEY_ISOLATED: 'YES'
          KT_JOURNEY_USER: p08-fixture
          KT_JOURNEY_PASSWORD: p08-only-ci-user-fixture
          KT_JOURNEY_OUT: tmp/p08-kt128
        run: |
          browser="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$browser" ]; then echo "NO_BROWSER_BINARY"; exit 2; fi
          export KT_JOURNEY_CHROMIUM="$browser"
          node --check tools/smoke/knowledge_journeys.mjs
          node --test tools/smoke/p08_*.test.mjs
          node tools/smoke/knowledge_journeys.mjs

      # Extend J8 browser ZIP export/preview with a FULL import into a different
      # freshly migrated PostgreSQL database (no Drive, media bytes or real user).
      # Retain evidence even on failure; only the J8 reconciler may mark J8 PASS.
      - name: Verify P08 J8 Vault clean-database roundtrip (synthetic, isolated)
        continue-on-error: true
        run: |
          set -euo pipefail
          qa() { docker compose -p kt-p08-ci --env-file "$RUNNER_TEMP/kt-p08.env" "$@"; }
          test -s tmp/p08-kt128/p08-results.json
          qa cp tools/smoke/p08_vault_clean_db.py api:/tmp/p08_vault_clean_db.py
          qa exec -T -e P08_VAULT_ISOLATED=YES -e P08_VAULT_MODE=source api \
            python manage.py shell -c "exec(compile(open('/tmp/p08_vault_clean_db.py',encoding='utf-8').read(),'/tmp/p08_vault_clean_db.py','exec'))"
          qa exec -T db sh -ec 'createdb --no-password -U "$POSTGRES_USER" --template=template0 --encoding=UTF8 kt_p08_vault_clean'
          qa exec -T -e POSTGRES_DB=kt_p08_vault_clean api python manage.py migrate --noinput
          qa exec -T -e POSTGRES_DB=kt_p08_vault_clean -e P08_VAULT_ISOLATED=YES -e P08_VAULT_MODE=target api \
            python manage.py shell -c "exec(compile(open('/tmp/p08_vault_clean_db.py',encoding='utf-8').read(),'/tmp/p08_vault_clean_db.py','exec'))"
          qa cp api:/tmp/p08-vault-clean/source.json tmp/p08-kt128/p08-j8-source.json
          qa cp api:/tmp/p08-vault-clean/result.json tmp/p08-kt128/p08-j8-clean-result.json
          node tools/smoke/p08_reconcile_j8.mjs \
            tmp/p08-kt128/p08-results.json \
            tmp/p08-kt128/p08-j8-source.json \
            tmp/p08-kt128/p08-j8-clean-result.json

      - name: Evaluate P15 real-browser keyboard and responsive behavior
        continue-on-error: true
        env:
          P15_QA_URL: http://127.0.0.1:62310
          P15_SYNTHETIC_QA: '1'
          P15_QA_USER: p08-fixture
          P15_QA_PASSWORD: p08-only-ci-user-fixture
          P15_CDP_MODULE: tools/smoke/p08_cdp.mjs
        run: |
          browser="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$browser" ]; then echo "NO_BROWSER_BINARY"; exit 2; fi
          export KT_JOURNEY_CHROMIUM="$browser"
          node tools/smoke/p15_accessibility.mjs --browser

      - name: Publish P15 browser screenshots and keyboard findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kt-p15-browser-accessibility
          path: tmp/p15-accessibility/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish real-browser evidence (private artifact only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kt-p08-real-browser-ledger
          path: tmp/p08-kt128/
          if-no-files-found: warn
          retention-days: 14

      # Leave the diagnostic P08/P15 steps continue-on-error to retain both
      # artefacts, then fail this one existing job if either gate is incomplete.
      # No extra Actions runner, provider API or test DB is started by this step.
      - name: Enforce G2 release-candidate browser evidence (fail on NOT_RUN)
        if: always()
        run: |
          node tools/smoke/release_acceptance_gate.mjs \
            --p08 tmp/p08-kt128/p08-results.json \
            --p15 tmp/p15-accessibility/browser-results.json

      - name: Shut down only P08 disposable containers and test volumes
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/kt-p08.env" ]; then
            docker compose -p kt-p08-ci --env-file "$RUNNER_TEMP/kt-p08.env" down --volumes --remove-orphans
            rm -f "$RUNNER_TEMP/kt-p08.env"
          fi
