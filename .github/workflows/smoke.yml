name: KT-001 smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose and start the stack
        run: |
          git rev-parse HEAD
          cp .env.example .env
          docker compose config --quiet
          docker compose up --detach --build --wait --wait-timeout 120

      - name: Test frontend resource lifecycle and capture
        run: docker compose exec -T web npm test

      - name: Test immutable backup archive and Drive retry behavior
        run: |
          docker compose cp tools/backup api:/tmp/kt-backup-tools
          docker compose exec -T -e PYTHONPATH=/app -e DJANGO_SETTINGS_MODULE=config.settings api python -m unittest discover -s /tmp/kt-backup-tools -p test_drive_bundle.py -v

      - name: Test controlled pilot isolation gates without external writes
        run: |
          docker compose exec -T api mkdir -p /tmp/kt-pilot/tools /tmp/kt-pilot/evals/knowledge
          docker compose cp tools/knowledge_pilot.py api:/tmp/kt-pilot/tools/knowledge_pilot.py
          docker compose cp tools/test_knowledge_pilot.py api:/tmp/kt-pilot/tools/test_knowledge_pilot.py
          docker compose cp evals/knowledge/pilot-cases.json api:/tmp/kt-pilot/evals/knowledge/pilot-cases.json
          docker compose exec -T api python -m unittest discover -s /tmp/kt-pilot/tools -p test_knowledge_pilot.py -v

      - name: Check Django and migrate forward and backward
        run: |
          docker compose exec -T api python manage.py check --database default
          docker compose exec -T api python manage.py makemigrations --check --dry-run
          docker compose exec -T api python manage.py migrate --check
          docker compose exec -T api python manage.py migrate sessions zero --noinput
          docker compose exec -T api python manage.py migrate sessions --noinput
          docker compose exec -T api python manage.py migrate --check
          docker compose exec -T api python manage.py migrate catalog zero --noinput
          docker compose exec -T api python manage.py migrate --noinput
          docker compose exec -T api python manage.py migrate --check
          docker compose exec -T api python manage.py test

      - name: Check worker, API and built frontend
        run: |
          docker compose exec -T worker python manage.py run_worker --check
          curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/health | jq -e '.status == "ready"'
          curl --fail --silent --show-error http://127.0.0.1:5173/api/v1/health | jq -e '.status == "ready"'
          curl --fail --silent --show-error http://127.0.0.1:5173/ | grep -F '<title>Kho Tri Thức</title>'

      - name: Capture and upload smoke through frontend proxy
        run: |
          docker compose exec -T -e DJANGO_SUPERUSER_PASSWORD=kt-smoke-fixture-only api python manage.py createsuperuser --noinput --username kt-smoke --email kt-smoke@example.invalid
          python3 tools/smoke/capture.py

      - name: Verify Compose backup and restore to a fresh database
        run: |
          bundle="$RUNNER_TEMP/kho-tri-thuc-backup"
          python3 tools/backup/backup.py --compose create "$bundle"
          python3 tools/backup/backup.py verify "$bundle"
          docker compose exec -T db sh -ec 'createdb --no-password -U "$POSTGRES_USER" --template=template0 --encoding=UTF8 kt_restore'
          python3 tools/backup/backup.py --compose restore "$bundle" --target-db kt_restore

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop test services
        if: always()
        run: docker compose down --volumes
